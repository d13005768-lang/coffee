<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeImperia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1410;
            color: #f5ead9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            opacity: 0.8;
            text-align: center;
        }
        .emoji {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="emoji">☕</div>
    <h1>CoffeeImperia</h1>
    <p>Добро пожаловать в игру!<br>Скоро здесь будет кофейня 🎮</p>
    
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Показываем приветствие
        if (tg.initDataUnsafe?.user) {
            const userName = tg.initDataUnsafe.user.first_name;
            document.querySelector('p').innerHTML = 
                `Привет, <strong>${userName}</strong>! 👋<br>Скоро здесь будет кофейня 🎮`;
        }
    </script>
</body>
</html>
