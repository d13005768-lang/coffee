<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CoffeeImperia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1410 0%, #2d1f15 100%);
            color: #f5ead9;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
        }
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(45, 34, 24, 0.8);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #c8956d, #8a5a3b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .brand-name {
            font-weight: 700;
            font-size: 16px;
        }
        
        .balance {
            background: rgba(200, 149, 109, 0.2);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
            color: #e8b87a;
        }
        
        .cafe-view {
            background: rgba(45, 34, 24, 0.6);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            min-height: 300px;
            position: relative;
            border: 1px solid rgba(200, 149, 109, 0.2);
        }
        
        .cafe-title {
            font-size: 18px;
            margin-bottom: 12px;
            color: #e8b87a;
        }
        
        .cafe-floor {
            background: linear-gradient(135deg, #3a2d20, #2d1f15);
            border-radius: 12px;
            padding: 20px;
            min-height: 250px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .table {
            background: rgba(139, 90, 60, 0.4);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            border: 2px dashed rgba(200, 149, 109, 0.3);
            transition: all 0.3s;
        }
        
        .table:hover {
            background: rgba(139, 90, 60, 0.6);
            border-color: #c8956d;
        }
        
        .table-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }
        
        .table-label {
            font-size: 12px;
            color: #b8a58c;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: rgba(45, 34, 24, 0.8);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #e8b87a;
        }
        
        .stat-label {
            font-size: 11px;
            color: #b8a58c;
            margin-top: 4px;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 20, 16, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid rgba(200, 149, 109, 0.2);
        }
        
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: none;
            border: none;
            color: #b8a58c;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            font-size: 11px;
        }
        
        .nav-btn.active {
            color: #e8b87a;
            background: rgba(200, 149, 109, 0.15);
        }
        
        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <div class="brand-logo">☕</div>
            <div class="brand-name" id="brandName">CoffeeImperia</div>
        </div>
        <div class="balance" id="balance">💰 100 000</div>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="level">1</div>
            <div class="stat-label">Уровень</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="rating">5.0</div>
            <div class="stat-label">Рейтинг</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="cafes">1</div>
            <div class="stat-label">Кафе</div>
        </div>
    </div>
    
    <div class="cafe-view">
        <div class="cafe-title">🏠 Моя кофейня</div>
        <div class="cafe-floor">
            <div class="table">
                <div class="table-icon">🪑</div>
                <div class="table-label">Стол 1</div>
            </div>
            <div class="table">
                <div class="table-icon">🪑</div>
                <div class="table-label">Стол 2</div>
            </div>
            <div class="table">
                <div class="table-icon">🪑</div>
                <div class="table-label">Стол 3</div>
            </div>
            <div class="table">
                <div class="table-icon">🪑</div>
                <div class="table-label">Стол 4</div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <button class="nav-btn active">
            <span class="nav-icon">☕</span>
            <span>Кафе</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">🗺️</span>
            <span>Карта</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">🛒</span>
            <span>Маркет</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">⬆️</span>
            <span>Улучшения</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">📋</span>
            <span>Задания</span>
        </button>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        if (tg.initDataUnsafe?.user) {
            const userName = tg.initDataUnsafe.user.first_name;
            document.getElementById('brandName').textContent = `Кафе ${userName}`;
        }
    </script>
</body>
</html>
