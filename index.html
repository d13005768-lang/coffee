<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CoffeeImperia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1410 0%, #2d1f15 100%);
            color: #f5ead9;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
        }
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(45, 34, 24, 0.8);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #c8956d, #8a5a3b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .brand-name {
            font-weight: 700;
            font-size: 16px;
        }
        
        .balance {
            background: rgba(200, 149, 109, 0.2);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
            color: #e8b87a;
        }
        
        /* Вид кофейни от первого лица */
        .cafe-scene {
            position: relative;
            background: linear-gradient(180deg, #3a2d20 0%, #2d1f15 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            min-height: 500px;
            overflow: hidden;
            border: 1px solid rgba(200, 149, 109, 0.2);
            perspective: 1000px;
        }
        
        /* Задняя стена */
        .back-wall {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(180deg, #4a3828 0%, #3a2d20 100%);
            border-bottom: 3px solid #2d1f15;
        }
        
        /* Окна */
        .window {
            position: absolute;
            width: 80px;
            height: 100px;
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 100%);
            border: 4px solid #6b4e3d;
            border-radius: 8px 8px 0 0;
            box-shadow: inset 0 0 20px rgba(135, 206, 235, 0.5);
        }
        
        .window.left {
            left: 30px;
            top: 30px;
        }
        
        .window.right {
            right: 30px;
            top: 30px;
        }
        
        /* Дверь входа */
        .door {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 20px;
            width: 70px;
            height: 120px;
            background: linear-gradient(180deg, #8b5a3c 0%, #6b4e3d 100%);
            border: 3px solid #4a3828;
            border-radius: 8px 8px 0 0;
        }
        
        .door::after {
            content: '🚪';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
        }
        
        /* Пол */
        .floor {
            position: absolute;
            bottom: 150px;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(180deg, #5a4a3a 0%, #4a3828 100%);
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
        }
        
        /* Столы в зале */
        .tables-area {
            position: absolute;
            top: 180px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            padding: 0 20px;
        }
        
        .table-row {
            display: flex;
            gap: 60px;
            justify-content: center;
        }
        
        .table-set {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .table {
            width: 60px;
            height: 40px;
            background: linear-gradient(135deg, #8b5a3c 0%, #6b4e3d 100%);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .chairs {
            display: flex;
            gap: 30px;
        }
        
        .chair {
            font-size: 24px;
        }
        
        /* Растения */
        .plant {
            position: absolute;
            font-size: 40px;
        }
        
        .plant.left {
            left: 20px;
            top: 220px;
        }
        
        .plant.right {
            right: 20px;
            top: 220px;
        }
        
        /* Стойка бариста (передний план) */
        .counter {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(180deg, #6b4e3d 0%, #4a3828 100%);
            border-top: 4px solid #8b5a3c;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }
        
        .counter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 12px;
            min-width: 80px;
        }
        
        .counter-icon {
            font-size: 40px;
        }
        
        .counter-label {
            font-size: 12px;
            color: #e8b87a;
            font-weight: 600;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: rgba(45, 34, 24, 0.8);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #e8b87a;
        }
        
        .stat-label {
            font-size: 11px;
            color: #b8a58c;
            margin-top: 4px;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 20, 16, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid rgba(200, 149, 109, 0.2);
        }
        
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: none;
            border: none;
            color: #b8a58c;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            font-size: 11px;
        }
        
        .nav-btn.active {
            color: #e8b87a;
            background: rgba(200, 149, 109, 0.15);
        }
        
        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <div class="brand-logo">☕</div>
            <div class="brand-name" id="brandName">CoffeeImperia</div>
        </div>
        <div class="balance" id="balance">💰 100 000</div>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="level">1</div>
            <div class="stat-label">Уровень</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="rating">5.0</div>
            <div class="stat-label">Рейтинг</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="cafes">1</div>
            <div class="stat-label">Кафе</div>
        </div>
    </div>
    
    <!-- Вид кофейни от первого лица -->
    <div class="cafe-scene">
        <!-- Задняя стена -->
        <div class="back-wall">
            <div class="window left"></div>
            <div class="door"></div>
            <div class="window right"></div>
        </div>
        
        <!-- Пол -->
        <div class="floor"></div>
        
        <!-- Растения -->
        <div class="plant left">🪴</div>
        <div class="plant right">🪴</div>
        
        <!-- Столы в зале -->
        <div class="tables-area">
            <div class="table-row">
                <div class="table-set">
                    <div class="chairs">
                        <span class="chair">🪑</span>
                        <span class="chair">🪑</span>
                    </div>
                    <div class="table">🟤</div>
                </div>
                <div class="table-set">
                    <div class="chairs">
                        <span class="chair">🪑</span>
                        <span class="chair">🪑</span>
                    </div>
                    <div class="table">🟤</div>
                </div>
            </div>
            <div class="table-row">
                <div class="table-set">
                    <div class="chairs">
                        <span class="chair">🪑</span>
                        <span class="chair">🪑</span>
                    </div>
                    <div class="table">🟤</div>
                </div>
                <div class="table-set">
                    <div class="chairs">
                        <span class="chair">🪑</span>
                        <span class="chair">🪑</span>
                    </div>
                    <div class="table">🟤</div>
                </div>
            </div>
        </div>
        
        <!-- Стойка бариста -->
        <div class="counter">
            <div class="counter-item">
                <div class="counter-icon">💰</div>
                <div class="counter-label">Касса</div>
            </div>
            <div class="counter-item">
                <div class="counter-icon">☕</div>
                <div class="counter-label">Кофемашина</div>
            </div>
            <div class="counter-item">
                <div class="counter-icon">🍰</div>
                <div class="counter-label">Витрина</div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <button class="nav-btn active">
            <span class="nav-icon">☕</span>
            <span>Кафе</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">🗺️</span>
            <span>Карта</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">🛒</span>
            <span>Маркет</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">⬆️</span>
            <span>Улучшения</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">📋</span>
            <span>Задания</span>
        </button>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        if (tg.initDataUnsafe?.user) {
            const userName = tg.initDataUnsafe.user.first_name;
            document.getElementById('brandName').textContent = `Кафе ${userName}`;
        }
    </script>
</body>
</html>
