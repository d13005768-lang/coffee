<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CoffeeImperia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1410;
            color: #f5ead9;
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }
        
        /* Верхняя панель */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(45, 34, 24, 0.95);
            padding: 10px 14px;
            margin-bottom: 8px;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #c8956d, #8a5a3b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .brand-name {
            font-weight: 700;
            font-size: 15px;
        }
        
        .balance {
            background: rgba(200, 149, 109, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            color: #e8b87a;
            font-size: 14px;
        }
        
        /* Статистика */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 0 14px;
            margin-bottom: 8px;
        }
        
        .stat-card {
            background: rgba(45, 34, 24, 0.8);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #e8b87a;
        }
        
        .stat-label {
            font-size: 10px;
            color: #b8a58c;
            margin-top: 2px;
        }
        
        /* Сцена кофейни */
        .cafe-scene {
            position: relative;
            margin: 0 14px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(200, 149, 109, 0.3);
            aspect-ratio: 4 / 3;
            background: #2d1f15;
        }
        
        .cafe-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Кликабельные зоны поверх картинки */
        .click-zone {
            position: absolute;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .click-zone:hover {
            border-color: rgba(232, 184, 122, 0.8);
            background: rgba(232, 184, 122, 0.15);
        }
        
        .click-zone:active {
            transform: scale(0.95);
        }
        
        .click-zone .icon {
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .click-zone:hover .icon {
            opacity: 1;
        }
        
        /* Позиции зон (примерно по картинке) */
        .zone-cash {
            bottom: 18%;
            left: 12%;
            width: 14%;
            height: 18%;
        }
        
        .zone-coffee {
            bottom: 15%;
            left: 32%;
            width: 22%;
            height: 22%;
        }
        
        .zone-display {
            bottom: 10%;
            right: 5%;
            width: 20%;
            height: 25%;
        }
        
        .zone-table1 {
            top: 40%;
            left: 20%;
            width: 15%;
            height: 15%;
        }
        
        .zone-table2 {
            top: 40%;
            right: 20%;
            width: 15%;
            height: 15%;
        }
        
        .zone-table3 {
            top: 55%;
            left: 20%;
            width: 15%;
            height: 15%;
        }
        
        .zone-table4 {
            top: 55%;
            right: 20%;
            width: 15%;
            height: 15%;
        }
        
        .zone-door {
            top: 5%;
            left: 45%;
            width: 10%;
            height: 15%;
        }
        
        /* Уведомление */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(45, 34, 24, 0.95);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #e8b87a;
            color: #e8b87a;
            font-weight: 600;
            transition: transform 0.3s;
            z-index: 100;
        }
        
        .notification.show {
            transform: translateX(-50%) translateY(0);
        }
        
        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 20, 16, 0.98);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-top: 1px solid rgba(200, 149, 109, 0.3);
        }
        
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 10px;
            background: none;
            border: none;
            color: #b8a58c;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            font-size: 10px;
        }
        
        .nav-btn.active {
            color: #e8b87a;
            background: rgba(200, 149, 109, 0.15);
        }
        
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <!-- Верхняя панель -->
    <div class="topbar">
        <div class="brand">
            <div class="brand-logo">☕</div>
            <div class="brand-name" id="brandName">CoffeeImperia</div>
        </div>
        <div class="balance" id="balance">💰 100 000</div>
    </div>
    
    <!-- Статистика -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="level">1</div>
            <div class="stat-label">Уровень</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="rating">5.0</div>
            <div class="stat-label">Рейтинг</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="cafes">1</div>
            <div class="stat-label">Кафе</div>
        </div>
    </div>
    
    <!-- Сцена кофейни -->
    <div class="cafe-scene">
        <img src="/static/images/cafe.png" alt="Кофейня" class="cafe-bg">
        
        <!-- Кликабельные зоны -->
        <div class="click-zone zone-cash" data-action="cash">
            <span class="icon">💰</span>
        </div>
        <div class="click-zone zone-coffee" data-action="coffee">
            <span class="icon"></span>
        </div>
        <div class="click-zone zone-display" data-action="display">
            <span class="icon">🍰</span>
        </div>
        <div class="click-zone zone-table1" data-action="table">
            <span class="icon">🪑</span>
        </div>
        <div class="click-zone zone-table2" data-action="table">
            <span class="icon">🪑</span>
        </div>
        <div class="click-zone zone-table3" data-action="table">
            <span class="icon">🪑</span>
        </div>
        <div class="click-zone zone-table4" data-action="table">
            <span class="icon">🪑</span>
        </div>
        <div class="click-zone zone-door" data-action="door">
            <span class="icon">🚪</span>
        </div>
    </div>
    
    <!-- Уведомление -->
    <div class="notification" id="notification"></div>
    
    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <button class="nav-btn active">
            <span class="nav-icon">☕</span>
            <span>Кафе</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">🗺️</span>
            <span>Карта</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">🛒</span>
            <span>Маркет</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">⬆️</span>
            <span>Улучшения</span>
        </button>
        <button class="nav-btn">
            <span class="nav-icon">📋</span>
            <span>Задания</span>
        </button>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        if (tg.initDataUnsafe?.user) {
            const userName = tg.initDataUnsafe.user.first_name;
            document.getElementById('brandName').textContent = `Кафе ${userName}`;
        }
        
        // Обработка кликов по зонам
        document.querySelectorAll('.click-zone').forEach(zone => {
            zone.addEventListener('click', () => {
                const action = zone.dataset.action;
                showNotification(getActionText(action));
            });
        });
        
        function getActionText(action) {
            const texts = {
                'cash': '💰 Касса — скоро здесь будет меню заказов',
                'coffee': ' Кофемашина — скоро здесь будет приготовление',
                'display': '🍰 Витрина — скоро здесь будут десерты',
                'table': '🪑 Стол — скоро здесь будут клиенты',
                'door': ' Вход — скоро здесь будут заходить посетители'
            };
            return texts[action] || 'Скоро здесь будет что-то интересное!';
        }
        
        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
